<svg xmlns="http://www.w3.org/2000/svg" width="680" height="240" viewBox="0 0 680 240" role="img" aria-label="Palo Alto Chamber of Commerce - Innovation Tree logo, light version for dark backgrounds">
  <!--
    LOGO 3 — LIGHT VERSION (for dark backgrounds)
    Same Innovation Tree as logo-3, recolored light: white / light teal / light orange.
    Light black background (8% opacity) for visibility on light backgrounds.
    To resize: change width / height below, or use CSS: width:100%; height:auto;
  -->
  <style>
    .title { font-family: Arial, Helvetica, sans-serif; font-size: 52px; font-weight: 800; letter-spacing: 0.5px; fill: #FFFFFF; }
    .title-accent { font-family: Arial, Helvetica, sans-serif; font-size: 52px; font-weight: 300; letter-spacing: 0.5px; fill: #5EEAD4; }
    .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 5.8px; fill: #FDBA74; }
    .tag { font-family: Arial, Helvetica, sans-serif; font-size: 11px; letter-spacing: 3px; fill: #CBD5E1; }
  </style>

  <!-- Black background -->
  <rect width="680" height="240" fill="black" rx="12"/>

  <!-- Circular badge with innovation tree -->
  <g transform="translate(12,12)">
    <circle cx="102" cy="102" r="102" fill="#14B8A6"/>
    <circle cx="102" cy="102" r="102" fill="none" stroke="#5EEAD4" stroke-width="2"/>
    <circle cx="102" cy="102" r="88" fill="#FFFFFF"/>
    <!-- circuit branches -->
    <g stroke="#0F766E" stroke-width="2.5" stroke-linecap="round" fill="none">
      <path d="M 102 168 L 102 112"/>
      <path d="M 102 132 L 68 96"/>
      <path d="M 102 132 L 136 96"/>
      <path d="M 102 112 L 78 76"/>
      <path d="M 102 112 L 126 76"/>
      <path d="M 102 112 L 102 66"/>
      <path d="M 68 96 L 52 76"/>
      <path d="M 136 96 L 152 76"/>
    </g>
    <!-- trunk -->
    <path d="M 96 168 L 99 128 L 105 128 L 108 168 Z" fill="#0F2A44"/>
    <!-- nodes -->
    <g>
      <circle cx="102" cy="60" r="9" fill="#EA580C"/><circle cx="102" cy="60" r="3.5" fill="#FFFFFF"/>
      <circle cx="78" cy="70" r="7" fill="#0F766E"/><circle cx="78" cy="70" r="2.5" fill="#FFFFFF"/>
      <circle cx="126" cy="70" r="7" fill="#0F766E"/><circle cx="126" cy="70" r="2.5" fill="#FFFFFF"/>
      <circle cx="52" cy="70" r="7" fill="#EA580C"/><circle cx="52" cy="70" r="2.5" fill="#FFFFFF"/>
      <circle cx="152" cy="70" r="7" fill="#EA580C"/><circle cx="152" cy="70" r="2.5" fill="#FFFFFF"/>
      <circle cx="68" cy="92" r="6" fill="#0F766E"/><circle cx="68" cy="92" r="2" fill="#FFFFFF"/>
      <circle cx="136" cy="92" r="6" fill="#0F766E"/><circle cx="136" cy="92" r="2" fill="#FFFFFF"/>
    </g>
    <!-- roots as circuit -->
    <g stroke="#0F766E" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.65">
      <path d="M 98 168 L 78 182"/><path d="M 106 168 L 126 182"/><path d="M 102 168 L 102 184"/>
    </g>
    <circle cx="78" cy="184" r="4" fill="#EA580C"/>
    <circle cx="126" cy="184" r="4" fill="#EA580C"/>
    <circle cx="102" cy="186" r="4" fill="#0F766E"/>
    <path d="M 52 188 Q 102 196 152 188" fill="none" stroke="#D2C295" stroke-width="1.5"/>
  </g>

  <!-- Text lockup — light -->
  <text x="242" y="96" class="title">PALO<tspan class="title-accent"> ALTO</tspan></text>
  <text x="244" y="128" class="subtitle">CHAMBER OF COMMERCE</text>
  <line x1="244" y1="144" x2="652" y2="144" stroke="#5EEAD4" stroke-width="1.5"/>
  <text x="244" y="168" class="tag">WHERE IDEAS TAKE ROOT</text>
  <text x="244" y="192" font-family="Arial, sans-serif" font-size="13px" fill="#E2E8F0">Birthplace of Silicon Valley — growing what's next.</text>
</svg>
